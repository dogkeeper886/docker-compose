name: host-exporters

services:
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--web.listen-address=:9100"
    environment:
      - TZ=Asia/Taipei

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    command:
      - "--port=8081"
      - "--docker_only=true"
      - "--disable_root_cgroup_stats=true"
      - "--disable_metrics=disk,diskIO,referenced_memory,hugetlb,resctrl"
      - "--housekeeping_interval=30s"
      - "--store_container_labels=false"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    environment:
      - TZ=Asia/Taipei
      - CADVISOR_HEALTHCHECK_URL=http://localhost:8081/healthz
