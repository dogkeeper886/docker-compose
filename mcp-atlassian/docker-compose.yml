services:
  mcp-atlassian:
    image: ghcr.io/sooperset/mcp-atlassian:latest
    container_name: mcp-atlassian
    ports:
      - "9000:9000"
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --transport
      - streamable-http
      - --port
      - "9000"
      - --stateless
      - -vv
    environment:
      - TZ=Asia/Taipei
