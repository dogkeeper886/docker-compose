<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
  <rect width="820" height="360" fill="#fff"/>
  <!-- targets file -->
  <rect x="20" y="20" width="250" height="320" rx="8" fill="#f3f3f3" stroke="#777"/>
  <text x="35" y="44" font-weight="bold">exporter-targets.yml</text>
  <text x="35" y="64" fill="#555">each entry: host:port + exporter label</text>
  <rect x="35" y="80" width="220" height="50" rx="6" fill="#fff" stroke="#777"/>
  <text x="48" y="100">exporter: node</text>
  <text x="48" y="119" fill="#555">node-exporter:9100, host:9100</text>
  <rect x="35" y="140" width="220" height="50" rx="6" fill="#fff" stroke="#777"/>
  <text x="48" y="160">exporter: libvirt</text>
  <text x="48" y="179" fill="#555">kvm-host:9177</text>
  <rect x="35" y="200" width="220" height="50" rx="6" fill="#fff" stroke="#777"/>
  <text x="48" y="220">exporter: nvidia-gpu</text>
  <text x="48" y="239" fill="#555">gpu-host:9835</text>
  <rect x="35" y="260" width="220" height="50" rx="6" fill="#fff" stroke="#777"/>
  <text x="48" y="280">exporter: ollama</text>
  <text x="48" y="299" fill="#555">gpu-host:9836</text>
  <!-- prometheus -->
  <rect x="330" y="20" width="250" height="320" rx="8" fill="#eaf0f8" stroke="#4a6c9b"/>
  <text x="345" y="44" font-weight="bold">Prometheus :19090</text>
  <text x="345" y="64" fill="#555">each job keeps its own label</text>
  <rect x="345" y="80" width="220" height="50" rx="6" fill="#fff" stroke="#4a6c9b"/><text x="358" y="110">job node</text>
  <rect x="345" y="140" width="220" height="50" rx="6" fill="#fff" stroke="#4a6c9b"/><text x="358" y="170">job libvirt</text>
  <rect x="345" y="200" width="220" height="50" rx="6" fill="#fff" stroke="#4a6c9b"/><text x="358" y="230">job nvidia-gpu</text>
  <rect x="345" y="260" width="220" height="50" rx="6" fill="#fff" stroke="#4a6c9b"/><text x="358" y="290">job ollama</text>
  <line x1="257" y1="105" x2="343" y2="105" stroke="#444" marker-end="url(#a)"/>
  <line x1="257" y1="165" x2="343" y2="165" stroke="#444" marker-end="url(#a)"/>
  <line x1="257" y1="225" x2="343" y2="225" stroke="#444" marker-end="url(#a)"/>
  <line x1="257" y1="285" x2="343" y2="285" stroke="#444" marker-end="url(#a)"/>
  <!-- static -->
  <rect x="630" y="20" width="170" height="130" rx="8" fill="#fbf1e6" stroke="#b07a3a"/>
  <text x="645" y="44" font-weight="bold">Not in the file</text>
  <text x="645" y="72">job prometheus</text>
  <text x="645" y="90" fill="#555">itself, localhost:9090</text>
  <text x="645" y="118">job cadvisor</text>
  <text x="645" y="136" fill="#555">this host only, :18081</text>
  <rect x="630" y="200" width="170" height="110" rx="8" fill="#eaf0f8" stroke="#4a6c9b"/>
  <text x="645" y="224" font-weight="bold">Grafana :13000</text>
  <text x="645" y="252" fill="#555">data source uid</text>
  <text x="645" y="270" fill="#555">prometheus, provisioned</text>
  <line x1="582" y1="255" x2="628" y2="255" stroke="#444" marker-end="url(#a)"/>
