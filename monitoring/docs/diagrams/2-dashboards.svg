<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
  <rect width="820" height="300" fill="#fff"/>
  <!-- seeded -->
  <rect x="20" y="20" width="380" height="260" rx="8" fill="#f3f3f3" stroke="#777"/>
  <text x="35" y="44" font-weight="bold">Seeded: dashboards this repo owns</text>
  <rect x="35" y="60" width="160" height="60" rx="6" fill="#fff" stroke="#777"/>
  <text x="48" y="84">provisioning/</text>
  <text x="48" y="102">dashboards/*.json</text>
  <rect x="225" y="60" width="160" height="60" rx="6" fill="#fff" stroke="#777"/>
  <text x="238" y="84">volume/grafana/</text>
  <text x="238" y="102">dashboards/*.json</text>
  <line x1="197" y1="90" x2="223" y2="90" stroke="#444" marker-end="url(#a)"/>
  <text x="35" y="148">make seed-dashboards copies them (make setup runs it).</text>
  <text x="35" y="172">Grafana reloads the files every 30 s.</text>
  <text x="35" y="196" fill="#9b3a3a">Save in the UI is refused: edit the JSON.</text>
  <text x="35" y="230" fill="#555">NVIDIA GPU Metrics</text>
  <text x="35" y="250" fill="#555">Node Exporter Full (FreeBSD)</text>
  <!-- imported -->
  <rect x="420" y="20" width="380" height="260" rx="8" fill="#eaf0f8" stroke="#4a6c9b"/>
  <text x="435" y="44" font-weight="bold">Imported: community dashboards</text>
  <rect x="435" y="60" width="160" height="60" rx="6" fill="#fff" stroke="#4a6c9b"/>
  <text x="448" y="84">grafana.com</text>
  <text x="448" y="102">IDs 1860, 14282</text>
  <rect x="625" y="60" width="160" height="60" rx="6" fill="#fff" stroke="#4a6c9b"/>
  <text x="638" y="84">Grafana database</text>
  <text x="638" y="102">in volume/grafana</text>
  <line x1="597" y1="90" x2="623" y2="90" stroke="#444" marker-end="url(#a)"/>
  <text x="435" y="148">make import-dashboards posts them over the API.</text>
  <text x="435" y="172">Editable in the UI like your own dashboards.</text>
  <text x="435" y="196" fill="#9b3a3a">Re-running overwrites your UI edits.</text>
  <text x="435" y="230" fill="#555">Node Exporter Full</text>
  <text x="435" y="250" fill="#555">Cadvisor exporter</text>
</svg>
