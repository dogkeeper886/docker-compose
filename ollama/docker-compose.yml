services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    runtime: nvidia
    volumes:
      - ./volume:/root/.ollama
      # To keep models on shared storage instead, bind-mount over the models
      # dir in docker-compose.override.yml - see the example file.
    environment:
      - TZ=Asia/Taipei