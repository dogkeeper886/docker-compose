<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
  <rect width="760" height="290" fill="#fff"/>
  <text x="20" y="28" font-weight="bold">Is the NVIDIA Container Toolkit installed on the host?</text>
  <!-- yes -->
  <rect x="20" y="45" width="350" height="225" rx="8" fill="#eef5ea" stroke="#5b8c4a"/>
  <text x="35" y="70" font-weight="bold">Yes: docker-compose.yml as is</text>
  <text x="35" y="98">runtime: nvidia</text>
  <text x="35" y="118">NVIDIA_VISIBLE_DEVICES=all</text>
  <text x="35" y="138">NVIDIA_DRIVER_CAPABILITIES=utility</text>
  <line x1="35" y1="155" x2="355" y2="155" stroke="#5b8c4a" stroke-dasharray="3 3"/>
  <text x="35" y="178" fill="#555">The toolkit adds nvidia-smi, libnvidia-ml</text>
  <text x="35" y="198" fill="#555">and the /dev/nvidia* nodes for every GPU.</text>
  <text x="35" y="228" fill="#555">Adding a GPU needs no change.</text>
  <!-- no -->
  <rect x="390" y="45" width="350" height="225" rx="8" fill="#fbf1e6" stroke="#b07a3a"/>
  <text x="405" y="70" font-weight="bold">No: add docker-compose.override.yml</text>
  <text x="405" y="98">runtime: runc</text>
  <text x="405" y="118">devices: /dev/nvidiactl, /dev/nvidia-uvm,</text>
  <text x="405" y="138">         /dev/nvidia0, /dev/nvidia1 ...</text>
  <text x="405" y="158">volumes: nvidia-smi, libnvidia-ml.so.1</text>
  <line x1="405" y1="172" x2="725" y2="172" stroke="#b07a3a" stroke-dasharray="3 3"/>
  <text x="405" y="195" fill="#555">You list one /dev/nvidiaN per GPU.</text>
  <text x="405" y="215" fill="#555">The libnvidia-ml path depends on the distro:</text>
  <text x="405" y="235" fill="#555">/usr/lib64 (EL) or</text>
  <text x="405" y="255" fill="#555">/usr/lib/x86_64-linux-gnu (Debian/Ubuntu).</text>
</svg>
