name: gpu-exporter

services:
  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.13.1
    restart: unless-stopped
    command:
      - --query-field-names=uuid,name,driver_version,utilization.gpu,utilization.memory,memory.total,memory.used,memory.free,temperature.gpu,power.draw,clocks.current.graphics,clocks.current.sm,clocks.current.memory,fan.speed
    # On a host without the NVIDIA Container Toolkit, map the device nodes
    # instead -- see docker-compose.override.example.yml.
    runtime: nvidia
    ports:
      - "9835:9835"
    environment:
      - TZ=Asia/Taipei
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
